name: Versión de un estilo

# Cada estilo lleva su propia versión: la etiqueta es <estilo>-v<versión>, por ejemplo consola-v1.0.0.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  publicar:
    name: Paquetes de la versión
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Estilo y versión
        id: etiqueta
        run: |
          echo "estilo=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"

      - name: Empaquetar y comprobar
        run: |
          python3 herramientas/empaquetar.py "${{ steps.etiqueta.outputs.estilo }}"
          python3 herramientas/comprobar.py "${{ steps.etiqueta.outputs.estilo }}"

      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.etiqueta.outputs.estilo }} ${{ steps.etiqueta.outputs.version }}
          body: |
            Estilo **${{ steps.etiqueta.outputs.estilo }}** para eXeLearning, versión ${{ steps.etiqueta.outputs.version }}.

            - El archivo `.zip` es el estilo: se importa desde el panel de estilos de eXeLearning.
            - El archivo `.elpx` es el recurso de ejemplo, con el estilo dentro: al abrirlo, eXeLearning ofrece instalarlo.

            Más información en la carpeta [${{ steps.etiqueta.outputs.estilo }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/${{ steps.etiqueta.outputs.estilo }}).
          files: ${{ steps.etiqueta.outputs.estilo }}/dist/*
