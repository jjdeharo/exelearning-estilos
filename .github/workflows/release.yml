name: Versión

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    name: Estilo y ejemplo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Número de versión
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Empaquetar y comprobar
        run: |
          python3 scripts/empaquetar.py
          python3 scripts/comprobar.py
          cp dist/consola.zip "exelearning-style-consola-${{ steps.ver.outputs.version }}.zip"

      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Consola ${{ steps.ver.outputs.version }}
          body: |
            Estilo **Consola** para eXeLearning 4.0.5 o posterior: el recurso como una terminal de Linux.

            - `consola.zip`: el estilo, para importarlo desde el panel de estilos de eXeLearning.
            - `ecuaciones-segundo-grado.elpx`: el recurso de ejemplo, con el estilo dentro. Al abrirlo, eXeLearning ofrece instalar el estilo.
            - `exelearning-style-consola-${{ steps.ver.outputs.version }}.zip`: el mismo estilo, con el número de versión en el nombre.
          files: |
            dist/consola.zip
            dist/ecuaciones-segundo-grado.elpx
            exelearning-style-consola-${{ steps.ver.outputs.version }}.zip

      - name: Guardar los paquetes (sin etiqueta)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: consola-${{ steps.ver.outputs.version }}
          path: |
            dist/consola.zip
            dist/ecuaciones-segundo-grado.elpx
          if-no-files-found: error
